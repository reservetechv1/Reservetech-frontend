<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>ReserveTech - Trocar minha senha</title>
  </head>
  <body>
    <header class="header-com-acao">
      <div class="marca-header"><img src="img/logo_fsaa.png" alt="Logo da faculdade" class="marca-logo" /><div class="marca-textos"><span class="marca-nome">ReserveTech</span><a href="sobre.html" class="link-sobre-interno">Sobre o projeto</a></div></div>
      <h1>Trocar minha senha</h1>
      <div class="header-acoes">
        <button class="btn-tema" onclick="alternarTema()" title="Alternar tema"></button>
        <span id="timer-sessao" title="Tempo restante da sessão"></span>
        <button id="btn-logout" class="btn-logout">Sair</button>
      </div>
    </header>

    <main>
      <div class="container-coleta-formulario">
        <a href="#" id="link-voltar-trocar-senha" class="link-voltar">Voltar</a>

        <h2>Trocar minha senha</h2>

        <form id="form-trocar-senha">
          <div class="coleta-dados">
            <label for="senha-atual">Senha atual</label>
            <input type="password" id="senha-atual" required />
          </div>

          <div class="coleta-dados">
            <label for="nova-senha">Nova senha</label>
            <input type="password" id="nova-senha" minlength="6" required />
          </div>

          <div class="coleta-dados">
            <label for="confirmar-senha">Confirmar nova senha</label>
            <input type="password" id="confirmar-senha" minlength="6" required />
          </div>

          <span id="erro-trocar-senha" class="mensagem-erro"></span>

          <button type="submit" class="btn-submit">Salvar nova senha</button>
        </form>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/tema.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/trocar-senha.js"></script>
  </body>
</html>
