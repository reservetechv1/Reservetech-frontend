<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>ReserveTech - Cadastrar Sala</title>
  </head>
  <body>
    <header class="header-com-acao">
      <div class="marca-header">
        <img
          src="img/logo_fsaa.png"
          alt="Logo da faculdade"
          class="marca-logo"
        /><span class="marca-nome">ReserveTech</span>
      </div>
      <h1>Painel TI</h1>
      <div class="header-acoes">
        <button
          class="btn-tema"
          onclick="alternarTema()"
          title="Alternar tema"
        ></button>
        <span id="timer-sessao" title="Tempo restante da sessão"></span>
      </div>
    </header>

    <main>
      <div class="container-coleta-formulario">
        <a href="painel-ti.html" class="link-voltar">Voltar para o Painel</a>

        <h2>Cadastrar Sala</h2>
        <p
          style="
            font-size: 13px;
            color: var(--texto-suave);
            margin-bottom: 12px;
          "
        >
          Adicione quantas salas quiser antes de salvar.
        </p>

        <form id="form-sala">
          <div id="lista-salas-form"></div>

          <button type="button" id="btn-adicionar-sala" class="btn-secundario">
            + Adicionar outra sala
          </button>

          <span id="erro-sala" class="mensagem-erro"></span>

          <button type="submit" class="btn-submit">Salvar Salas</button>
        </form>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/tema.js"></script>

    <script src="js/logout.js"></script>
    <script src="js/cadastro-sala.js"></script>
  </body>
</html>
