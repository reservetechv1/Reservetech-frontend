<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>ReserveTech - Gerenciar Usuários</title>
  </head>
  <body>
    <header class="header-com-acao">
      <div class="marca-header">
        <img
          src="img/logo_fsaa.png"
          alt="Logo da faculdade"
          class="marca-logo"
        />
        <div class="marca-textos">
          <span class="marca-nome">ReserveTech</span
          ><a href="sobre.html" class="link-sobre-interno">Sobre o projeto</a
          ><a href="trocar-senha.html" class="link-sobre-interno"
            >Trocar minha senha</a
          >
        </div>
      </div>
      <h1>Painel TI</h1>
      <div class="header-acoes">
        <button
          class="btn-tema"
          onclick="alternarTema()"
          title="Alternar tema"
        ></button>
        <span id="timer-sessao" title="Tempo restante da sessão"></span>
      </div>
    </header>

    <main>
      <div class="container-coleta-formulario">
        <a href="painel-ti.html" class="link-voltar">Voltar para o Painel</a>

        <h2>Gerenciar Usuários</h2>

        <div class="barra-selecao">
          <label class="opcao-checkbox">
            <input type="checkbox" id="check-selecionar-todos" />
            Selecionar todos
          </label>
          <div class="barra-selecao-acoes">
            <button
              type="button"
              id="btn-desativar-selecionados"
              class="btn-cancelar"
            >
              Desativar selecionados
            </button>
            <button
              type="button"
              id="btn-ativar-selecionados"
              class="btn-confirmar"
            >
              Ativar selecionados
            </button>
          </div>
        </div>

        <div id="lista-usuarios"></div>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/tema.js"></script>

    <script src="js/logout.js"></script>
    <script src="js/gerenciar-usuarios.js"></script>
  </body>
</html>
