<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>ReserveTech - Cadastrar Equipamento</title>
  </head>
  <body>
    <header class="header-com-acao">
      <div class="marca-header">
        <img
          src="img/logo_fsaa.png"
          alt="Logo da faculdade"
          class="marca-logo"
        />
        <div class="marca-textos">
          <span class="marca-nome">ReserveTech</span
          ><a href="sobre.html" class="link-sobre-interno">Sobre o projeto</a
          ><a href="trocar-senha.html" class="link-sobre-interno"
            >Trocar minha senha</a
          >
        </div>
      </div>
      <h1>Painel TI</h1>
      <div class="header-acoes">
        <button
          class="btn-tema"
          onclick="alternarTema()"
          title="Alternar tema"
        ></button>
        <span id="timer-sessao" title="Tempo restante da sessão"></span>
      </div>
    </header>

    <main>
      <div class="container-coleta-formulario">
        <a href="painel-ti.html" class="link-voltar">Voltar para o Painel</a>

        <h2>Cadastrar Equipamento</h2>
        <p
          style="
            font-size: 13px;
            color: var(--texto-suave);
            margin-bottom: 12px;
          "
        >
          Adicione quantos equipamentos quiser antes de salvar.
        </p>

        <form id="form-equipamento">
          <div id="lista-equipamentos-form"></div>

          <button
            type="button"
            id="btn-adicionar-equipamento"
            class="btn-secundario"
          >
            + Adicionar outro equipamento
          </button>

          <span id="erro-equipamento" class="mensagem-erro"></span>

          <button type="submit" class="btn-submit">Salvar Equipamentos</button>
        </form>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/tema.js"></script>

    <script src="js/logout.js"></script>
    <script src="js/cadastro-equipamento.js"></script>
  </body>
</html>
